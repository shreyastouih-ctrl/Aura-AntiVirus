name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install packaging + GUI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg rpm \
            libgtk-3-dev libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libfontconfig1-dev
      - run: bash packaging/linux/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/linux/*.tar.gz
            dist/linux/*.deb
            dist/linux/*.rpm
          if-no-files-found: error

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: install mingw + wixl
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 wixl wixl-data
      - run: bash packaging/windows/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/windows/*.msi
            dist/windows/*.zip
          if-no-files-found: error

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
