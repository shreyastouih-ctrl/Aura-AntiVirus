name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y dpkg rpm
      - run: bash packaging/linux/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/linux/*.tar.gz
            dist/linux/*.deb
            dist/linux/*.rpm
          if-no-files-found: error

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 msitools wixl wixl-data
      - run: bash packaging/windows/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/windows/*.msi
            dist/windows/*.zip
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: bash packaging/macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/macos/*.pkg
            dist/macos/*.dmg
          if-no-files-found: error

  release:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
