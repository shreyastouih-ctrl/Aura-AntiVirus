name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install packaging + GUI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg rpm \
            libgtk-3-dev libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libfontconfig1-dev
      - run: bash packaging/linux/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/linux/*.tar.gz
            dist/linux/*.deb
            dist/linux/*.rpm
          if-no-files-found: error

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: install mingw + wixl
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 wixl wixl-data
      - run: bash packaging/windows/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/windows/*.msi
            dist/windows/*.zip
          if-no-files-found: error

  data-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build signature data pack
        run: |
          tar -czf auraav-data.tar.gz -C data .
          ls -l auraav-data.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: data
          path: auraav-data.tar.gz
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: bash packaging/macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/macos/*.pkg
            dist/macos/*.dmg
            dist/macos/*.tar.gz
          if-no-files-found: error

  release:
    needs: [linux, windows, data-pack, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: create stable download aliases
        run: |
          set -euo pipefail
          cd artifacts
          cp linux/auraav-*-linux-amd64.tar.gz auraav-linux-amd64.tar.gz
          cp linux/*.deb                       auraav-linux-amd64.deb
          cp linux/*.rpm                       auraav-linux-amd64.rpm
          cp windows/*.zip                     auraav-win64.zip
          cp windows/*.msi                     auraav-win64.msi
          cp macos/*.dmg                       auraav-macos.dmg
          cp macos/*.pkg                       auraav-macos.pkg
          cp macos/*.tar.gz                    auraav-macos.tar.gz
          ls -R .
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
