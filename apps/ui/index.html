<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>auraAV</title>
  <style>
    :root { color-scheme: dark; }
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
    .container { max-width: 960px; margin: 0 auto; padding: 24px; }
    h1 { margin: 0; font-size: 28px; }
    .brand { color: #4ade80; }
    .subtitle { color: #94a3b8; margin: 4px 0 20px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 18px; margin-bottom: 18px; }
    h2 { margin: 0 0 10px; font-size: 17px; }
    .btn { background: #4ade80; color: #04210f; border: none; padding: 10px 18px; border-radius: 7px; font-weight: 650; cursor: pointer; margin: 0 8px 8px 0; }
    .btn-secondary { background: #334155; color: #e2e8f0; }
    .btn:hover { filter: brightness(1.1); }
    select { background: #0f172a; color: #e2e8f0; border: 1px solid #334155; border-radius: 6px; padding: 8px; }
    .status { padding: 14px; background: #0f172a; border-radius: 7px; border: 1px solid #334155; margin-top: 10px; }
    .progress-bar { width: 100%; height: 7px; background: #334155; border-radius: 4px; overflow: hidden; margin-top: 10px; }
    .progress-fill { height: 100%; width: 0; background: #4ade80; transition: width .3s; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid #334155; vertical-align: top; }
    th { color: #94a3b8; font-weight: 600; }
    .malicious { color: #f87171; font-weight: 700; }
    .suspicious { color: #fbbf24; font-weight: 600; }
    .clean { color: #4ade80; }
    .muted { color: #94a3b8; }
  </style>
</head>
<body>
  <div class="container">
    <h1><span class="brand">aura</span>AV</h1>
    <p class="subtitle">Unified multi-engine antivirus — offline-first, no subscription. Every detection layer runs on every file at once.</p>

    <div class="card">
      <h2>Scan</h2>
      <button class="btn" id="quickScan">Quick Scan</button>
      <button class="btn btn-secondary" id="fullScan">Full Scan</button>
      <button class="btn btn-secondary" id="scanDrives">Scan Removable Drives</button>
      <button class="btn btn-secondary" id="monitorToggle">Enable Real-time</button>
      <label class="muted" style="margin-left:8px">Sensitivity:
        <select id="sensitivity">
          <option value="low" selected>Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
          <option value="off">Off</option>
        </select>
      </label>
      <div id="status" class="status">Ready to scan.</div>
      <div class="progress-bar" id="progressBar" style="display:none"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <div class="card">
      <h2>Detections</h2>
      <div id="results"><span class="muted">No scan run yet.</span></div>
    </div>

    <div class="card">
      <h2>Quarantine <button class="btn btn-secondary" id="refreshQuarantine" style="float:right;margin:0">Refresh</button></h2>
      <div id="quarantine">Loading…</div>
    </div>

    <div class="card">
      <h2>History</h2>
      <button class="btn btn-secondary" id="historyThreats">Recent Threats</button>
      <button class="btn btn-secondary" id="historyAll">Recent Scans</button>
      <div id="history"></div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
