[package]
name = "auraav-cli"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
auraav-core = { path = "../auraav-core" }
auraav-platform = { path = "../auraav-platform" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dirs = "5.0"
uuid = { version = "1.28.0", features = ["v4"] }
serde_json = "1.0"
